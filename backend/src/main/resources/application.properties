spring.application.name=backend

# ===== Load .env file =====
spring.config.import=optional:file:.env[.properties]

# ===== Server Port (Supports Render's PORT and local SERVER_PORT) =====
server.port=${PORT:${SERVER_PORT:5000}}

# ===== PostgreSQL / Neon Database Connection =====
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate Settings =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Flyway Migration Settings =====
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ===== JWT Settings =====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# ===== Cloudinary Settings =====
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:${CLOUD_NAME:dprastyf2}}
cloudinary.api-key=${CLOUDINARY_API_KEY:${CLOUD_API:571731628332311}}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:${CLOUD_SECRET:GpHhFk_bNGHqQdMMBImSzgbbdaY}}
cloudinary.folder=${CLOUDINARY_FOLDER:samples/Lankan vibe}

